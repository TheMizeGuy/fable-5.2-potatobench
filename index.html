<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="The County: a potato farming game. Plant, tend and dig a crop you cannot see until dig day, through seasons nobody can know ahead." />
    <meta name="theme-color" content="#161f1b" />
    <title>The County</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      /* The name alone on a quiet ground, until the land can be drawn. */
      html, body { margin: 0; height: 100%; background: #161f1b; }
      #splash { position: fixed; inset: 0; z-index: 5; background: #161f1b; pointer-events: none; transition: background-color 600ms cubic-bezier(0.2, 0, 0, 1), opacity 300ms cubic-bezier(0.4, 0, 1, 1) 400ms; }
      #splash.gone { background-color: transparent; opacity: 0; }
      .splash-name {
        position: absolute;
        left: max(48px, env(safe-area-inset-left, 0px));
        bottom: 256px;
        margin: 0;
        font: 600 clamp(56px, 6vw + 16px, 128px) / 0.92 'Fraunces Variable', Georgia, 'Times New Roman', serif;
        letter-spacing: -0.02em;
        color: #f3ecdc;
      }
      @media (max-width: 519px) { .splash-name { left: 16px; bottom: 300px; } }
      @media (max-height: 500px) and (orientation: landscape) { .splash-name { font-size: 48px; } }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
      .reduce-motion #splash { transition: none; }
    </style>
  </head>
  <body>
    <canvas id="field" role="img" aria-label="The farm: fields on a slope above a brook"></canvas>
    <div id="ui"></div>
    <div id="splash" aria-hidden="true"><p class="splash-name">The County</p></div>
    <noscript>The County needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
