<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The County - weighing</title>
<link rel="stylesheet" href="system.css">
</head>
<body>
<!--SPRITES-->
<main class="stage october" aria-label="Dig day: North Ridge on the scale">
  <div class="veil deep"></div>
  <!--@bank cash="−$38,790" p0="true" p1="false" contract="none" extra="stopped"-->

  <!-- the reveal: the platform scale's face, the needle sweeping round the grades; the ticket prints below it -->
  <section class="scale-face sheet" role="status" aria-label="Weighing North Ridge">
    <p class="t-label" style="color:var(--ink)">North Ridge · Kennebec · on the scale</p>
    <div class="dial"><!--@dial--></div>
    <p class="readout"><span class="stamped">1,430</span><span class="t-label" style="color:var(--violet);font-size:18px">cwt off the field</span></p>
    <div class="printing" aria-hidden="true"><div class="slip"><span>Weigh ticket</span><span class="stamped">No. 1-1</span></div></div>
  </section>
</main>
</body>
</html>
