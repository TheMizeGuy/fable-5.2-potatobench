<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The County - spring</title>
<link rel="stylesheet" href="system.css">
</head>
<body>
<!--SPRITES-->
<main class="stage snow" aria-label="The farm in spring, Year 1">
  <section class="bank plan-bank" aria-label="Cash">
    <div class="mount"><div class="face">
      <div class="balance"><span class="t-label when">Balance</span><span class="t-figure">$18,000</span></div>
      <div class="clock plan"><span class="t-label season-word">Spring · planning</span><button class="menu" aria-label="Menu"><i class="i i-menu"></i></button></div>
    </div></div>
  </section>

  <!--@tag x="520" y="362" nm="North Ridge" icon="planted" listed="var-katahdin"-->
  <!--@tag x="790" y="380" nm="South Ridge" icon="rest" listed="var-rest"-->
  <!--@tag x="430" y="448" nm="Upper Middle" icon="planted" listed="var-katahdin"-->
  <!--@tag x="760" y="470" nm="Lower Middle" icon="rest" listed="var-rest"-->
  <!--@tag x="300" y="578" nm="Brook Field" icon="planted" listed="var-katahdin"-->
  <!--@tag x="680" y="612" nm="Bottom Field" icon="planted" listed="var-katahdin"-->

  <!-- the spring sheet: the seed and supply catalogue, its order blank at the foot -->
  <section class="catalogue sheet" aria-label="Spring plan">
    <header class="masthead"><h1>Spring</h1><span class="t-label">Year 1 of 5</span></header>
    <div class="cat-body">
      <button class="fold"><i class="i i-plant"></i><b>Fields</b><span class="quiet it">4 in potatoes, 2 resting</span><span class="dots" style="flex:1"></span><span class="num">$39,300</span><span class="chev">›</span></button>
      <div class="fold open"><i class="i i-people"></i><b>People</b><span class="quiet it">3 asking for work</span><span style="flex:1"></span><span class="num">$450 a month</span><span class="chev">⌄</span></div>
      <!--@applicants-->
      <button class="fold"><i class="i i-land"></i><b>Land</b><span class="quiet it">8 to rent, 10 for sale</span><span style="flex:1"></span><span class="chev">›</span></button>
      <button class="fold"><i class="i i-contract"></i><b>Contracts</b><span class="quiet it">3 offered</span><span style="flex:1"></span><span class="chev">›</span></button>
      <button class="fold"><i class="i i-machine"></i><b>Equipment</b><span class="quiet it">8 to buy</span><span style="flex:1"></span><span class="chev">›</span></button>
    </div>
    <footer class="order-blank">
      <p class="lead"><span>This plan, with wages</span><span class="dots"></span><b class="num big">$39,750</b></p>
      <p class="lead quiet"><span class="it">On the spring loan</span><span class="dots"></span><span class="num">$21,750</span></p>
      <p class="lead quiet"><span class="it">Due at the year end</span><span class="dots"></span><span class="num c-red">$21,000</span></p>
      <button class="btn go wide">Start the season <i class="i i-arrow"></i></button>
    </footer>
  </section>
</main>
</body>
</html>
