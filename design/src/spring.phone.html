<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The County - spring, phone</title>
<link rel="stylesheet" href="system.css">
</head>
<body>
<!--SPRITES-->
<main class="stage snow phone" aria-label="The farm in spring, Year 1">
  <div class="top-row">
    <div class="balance sheet laid"><span class="t-label when">Balance</span><span class="t-figure">$18,000</span></div>
    <button class="iconbtn sheet laid" style="width:52px;height:52px;background-color:var(--manila)" aria-label="Menu"><i class="i i-menu"></i></button>
  </div>
  <!--@tag x="240" y="99" nm="North Ridge" icon="planted" listed="var-katahdin"-->
  

  <section class="catalogue sheet" aria-label="Spring plan">
    <header class="masthead"><h1>Spring</h1><span class="t-label">Year 1 of 5</span></header>
    <div class="cat-body">
      <button class="fold"><i class="i i-plant"></i><b>Fields</b><span class="quiet it">4 to plant</span><span style="flex:1"></span><span class="num">$39,300</span><span class="chev">›</span></button>
      <div class="fold open"><i class="i i-people"></i><b>People</b><span class="quiet it">3 asking</span><span style="flex:1"></span><span class="num">$450/mo</span><span class="chev">⌄</span></div>
      <!--@applicants mode="one"-->
      <div class="fold more" role="group" aria-label="The other folds"><button class="btn"><i class="i i-land"></i>Land</button><button class="btn"><i class="i i-contract"></i>Contracts</button><button class="btn"><i class="i i-machine"></i>Equipment</button></div>
    </div>
    <footer class="order-blank">
      <p class="lead"><span>This plan, with wages</span><span class="dots"></span><b class="num big">$39,750</b></p>
      <p class="lead quiet"><span class="it">Due at the year end</span><span class="dots"></span><span class="num c-red">$21,000</span></p>
      <button class="btn go wide">Start the season <i class="i i-arrow"></i></button>
    </footer>
  </section>
</main>
</body>
</html>
