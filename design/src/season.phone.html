<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The County - season, phone</title>
<link rel="stylesheet" href="system.css">
</head>
<body>
<!--SPRITES-->
<main class="stage july phone" aria-label="The farm, July">
  <!-- the top: one board, no more than a fifth of the height -->
  <section class="almanac" aria-label="Date, forecast, cash and goal">
    <div class="mount">
      <div class="face">
        <div class="leaf"><span class="day">12</span><span class="month">July</span><span class="weekday">Sunday</span></div>
        <div class="forecast" aria-label="Forecast">
          <div class="d"><span class="t-label">Today</span><i class="i i-sun"></i><span class="hi">84°</span></div>
          <div class="d"><span class="t-label">Mon</span><i class="i i-sun"></i><span class="hi">86°</span></div>
          <div class="d"><span class="t-label">Tue</span><i class="i i-cloud"></i><span class="hi">71°</span></div>
        </div>
        <div class="cash"><span class="t-label">Balance</span><span class="t-figure">−$22,820</span></div>
      </div>
      <div class="season-track"><span class="t-label">Apr</span><span class="bar" role="img" aria-label="The season: 46% through"><i style="width:46%"></i><b style="left:46%"></b></span><span class="t-label">Oct</span></div>
    </div>
    <!--@goal-spray-->
  </section>

  <!--@tag x="178" y="344" nm="North Ridge" need="need-rogue"-->
  <!--@tag x="118" y="430" nm="Upper Middle" need="need-spray-next"-->
  <!--@tag x="300" y="474" nm="Lower Middle" icon="rest"-->
  <!--@tag x="236" y="560" nm="Bottom Field" need="need-hill"-->
  <!--@pin-you x="330" y="414" label="You, spraying"-->
  <!--@pin-verna x="336" y="318" cls=" needs" badge="badge-needs" label="Verna, worn out: needs you"-->

  <section class="alerts" aria-label="Alerts">
    <p class="alert bad"><i class="i i-blight"></i>North Ridge: blight on 2 hills</p>
  </section>

  <!-- the thumb: the clock and the menu, the people under them -->
  <div class="dock">
    <div class="clock" role="group" aria-label="Clock">
      <button class="k" aria-pressed="false" aria-label="Pause"><i class="i i-pause"></i></button>
      <button class="k" aria-pressed="true">1×</button>
      <button class="k" aria-pressed="false">2×</button>
      <button class="k" aria-pressed="false">3×</button>
      <button class="menu" aria-label="Menu"><i class="i i-menu"></i></button>
    </div>
    <!--@timebook c3=" needs" d3="Worn out" d0="Spray" d1="Fell" d2="Build" d4="Idle"-->
  </div>
</main>
</body>
</html>
